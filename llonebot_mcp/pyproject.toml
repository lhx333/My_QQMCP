[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniqq-mcp"
version = "2.0.0"
description = "LLOneBot OneBot 11 MCP server with Streamable HTTP transport, 74 named tools and NapCat tool-name compatibility"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "omniqq",
    "omniqq-mcp",
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "streamable-http",
    "remote-mcp",
    "llonebot",
    "llbot",
    "onebot",
    "onebot11",
    "qq-bot",
    "ntqq",
    "ai-agent",
    "claude-desktop",
    "cursor",
    "antigravity"
]
dependencies = [
    "aiohttp>=3.8.0",
    "websockets>=14.0,<17",
    "psutil>=5.9.0"
]

[project.scripts]
omniqq-mcp = "llonebot_mcp.run_mcp:main"

[tool.setuptools]
packages = ["llonebot_mcp", "llonebot_mcp.tools"]
package-dir = {llonebot_mcp = "."}
